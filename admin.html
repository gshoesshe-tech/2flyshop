<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2FLY!GALLERIA — Admin</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./app.js" defer></script>
</head>
<body class="page-admin" data-page="admin">

  <div class="adminWrap">
    <div class="adminTop">
      <div>
        <div class="adminTitle">Admin Dashboard</div>
        <div class="adminSub">Manage your inventory.</div>
      </div>
      <a class="btn btn--ghost" href="./shop.html">Go to Shop →</a>
    </div>

    <section class="adminCard">
      <h3 class="adminCard__title">Step 1: Product Details</h3>

      <div class="adminGrid">
        <input id="aName" class="input" placeholder="Product Name (Required)" />
        <input id="aPrice" class="input" placeholder="Price (e.g. 150)" inputmode="decimal" />
        <input id="aCode" class="input" placeholder="Code (e.g. TEE-001)" />
        <input id="aSku" class="input" placeholder="SKU (Optional)" />

        <select id="aCategory" class="input">
          <option value="Earrings">Earrings</option>
          <option value="Tank Tops">Tank Tops</option> 
          <option value="Boxers">Boxers</option>
          <option value="Skull Caps">Skull Caps</option>
          <option value="Close Caps">Close Caps</option>
        </select>

        <select id="aStatus" class="input">
          <option value="active">Status: Active</option>
          <option value="inactive">Status: Hidden</option>
        </select>

        <label class="checkRow">
          <input id="aSoldOut" type="checkbox" />
          <span>Mark as Sold Out</span>
        </label>
      </div>

      <br>
      <h3 class="adminCard__title">Step 2: Product Images</h3>
      <div class="adminMedia">
        <div class="adminMedia__title">Option A: Paste an Image Link</div>
        <div class="adminMedia__row">
          <input id="aImageUrl" class="input" placeholder="https://..." />
          <button id="addUrlBtn" class="btn btn--ghost" type="button">Add Link</button>
        </div>

        <div class="adminMedia__title" style="margin-top:10px;">Option B: Upload Files</div>
        <div class="adminMedia__row">
          <input id="aFiles" class="input" type="file" accept="image/*" multiple />
          <button id="uploadFilesBtn" class="btn btn--ghost" type="button">Upload Selected Files</button>
        </div>

        <div id="imgList" class="imgList"></div>
      </div>

      <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <h3 class="adminCard__title">Step 3: Save</h3>
        <button id="createProductBtn" class="btn btn--solid btn--wide" type="button" style="background: #00ff88; color: #000; border:none;">
          CREATE PRODUCT NOW
        </button>
        <div id="adminMsg" class="adminMsg" style="text-align:center; font-weight:bold; margin-top:10px;"></div>
      </div>
    </section>

    <section class="adminCard">
      <h3 class="adminCard__title">Current Inventory</h3>
      <div id="adminProducts" class="adminProducts"></div>
    </section>
  </div>

</body>
</html>
}
