<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2FLY Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./style.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>

<body data-page="admin">

  <div class="adminWrap">

    <h1>2FLY!GALLERIA — Admin</h1>

    <div id="adminMsg" class="adminMsg"></div>

    <!-- CREATE PRODUCT -->
    <section class="adminCard">

      <h3>Create Product</h3>

      <input id="aName" placeholder="Product name" />
      <input id="aPrice" type="number" placeholder="Price" />

      <input id="aCode" placeholder="Code (REQUIRED)" />
      <input id="aSku" placeholder="SKU (optional)" />

      <select id="aCategory">
        <option>Earrings</option>
        <option>Boxers</option>
        <option>Skull Caps</option>
        <option>Close Caps</option>
        <option>Tank Tops</option>
      </select>

      <label>
        <input type="checkbox" id="aSoldOut" />
        Sold Out
      </label>

      <hr />

      <!-- IMAGE UPLOAD -->
      <h4>Images</h4>

      <input id="aImageUrl" placeholder="Paste image URL" />
      <button id="addUrlBtn" type="button">Add URL</button>

      <input id="aFiles" type="file" multiple accept="image/*" />
      <button id="uploadFilesBtn" type="button">Upload Files</button>

      <div id="imgList" class="imgList"></div>

      <button id="createProductBtn" class="btn btn--solid">
        Create Product
      </button>

    </section>

    <!-- PRODUCT LIST -->
    <section class="adminCard">
      <h3>Products</h3>
      <div id="adminProducts"></div>
    </section>

  </div>

</body>
</html>
