<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2FLY — Product dropdown preview</title>
  <style>
    :root{
      --bg:#050505;
      --panel:rgba(0,0,0,.72);
      --stroke:rgba(255,255,255,.10);
      --stroke2:rgba(255,255,255,.16);
      --txt:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.55);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --r:16px;
      --fontHead: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --fontBody: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800;900&display=swap');
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#fff;font-family:var(--fontBody)}

    /* Topbar (matches your current vibe, not “dosmil”) */
    .topbar{
      position:sticky; top:0; z-index:50;
      height:76px;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 22px;
      background:rgba(0,0,0,.60);
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .left{display:flex; align-items:center; gap:18px;}
    .brand{font-family:var(--fontHead);font-weight:900;letter-spacing:.02em;font-size:26px;}

    .nav{display:flex; align-items:center; gap:12px;}
    .navBtn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);
      color:#fff;
      border-radius:999px;
      padding:11px 14px;
      font-family:var(--fontHead);
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
      font-size:11px;
      cursor:pointer;
      display:inline-flex; align-items:center; gap:10px;
    }
    .navBtn:hover{border-color:rgba(255,255,255,.22)}

    .caret{
      width:10px;height:10px;display:inline-block;
      border-right:2px solid rgba(255,255,255,.75);
      border-bottom:2px solid rgba(255,255,255,.75);
      transform: rotate(45deg);
      margin-top:-2px;
      transition: transform .16s ease;
    }
    .dropdown.is-open .caret{ transform: rotate(-135deg); margin-top:2px; }

    .dropdown{ position:relative; }

    .menu{
      position:absolute;
      top:calc(100% + 12px);
      left:0;
      width:260px;
      background:var(--panel);
      border:1px solid var(--stroke);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      padding:10px;
    }
    .menu[hidden]{display:none;}

    .menuTitle{
      padding:10px 10px 8px;
      font-family:var(--fontHead);
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:10px;
      color:var(--muted);
    }

    .menuItem{
      width:100%;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid transparent;
      background:transparent;
      color:var(--txt);
      font-family:var(--fontHead);
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:12px;
      cursor:pointer;
    }
    .menuItem:hover{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.10); }

    .pillTag{
      font-family:var(--fontBody);
      font-weight:600;
      letter-spacing:.02em;
      text-transform:none;
      font-size:11px;
      color:rgba(255,255,255,.55);
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
    }

    .divider{ height:1px; background:rgba(255,255,255,.08); margin:8px 10px; }

    /* Fake page content just for preview */
    .hero{min-height:520px; border-bottom:1px solid rgba(255,255,255,.06); position:relative; overflow:hidden;}
    .hero::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.10), rgba(0,0,0,.85) 65%),
        linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.85));
    }
    .heroInner{position:relative; padding:120px 22px 90px; display:flex; flex-direction:column; align-items:center; gap:22px;}
    .hint{color:rgba(255,255,255,.55); letter-spacing:.18em; text-transform:uppercase; font-size:11px; text-align:center;}
    .big{font-family:var(--fontHead); font-weight:900; letter-spacing:.08em; font-size:44px; text-transform:uppercase;}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="left">
      <div class="brand">2FLY!GALLERIA</div>

      <nav class="nav" aria-label="Shop navigation">
        <div class="dropdown" id="prodDD">
          <button class="navBtn" id="prodBtn" type="button" aria-haspopup="true" aria-expanded="false">
            PRODUCTS <span class="caret" aria-hidden="true"></span>
          </button>

          <div class="menu" id="prodMenu" role="menu" hidden>
            <div class="menuTitle">Browse categories</div>

            <button class="menuItem" type="button" role="menuitem">
              Earrings <span class="pillTag">Category</span>
            </button>
            <button class="menuItem" type="button" role="menuitem">
              Tank Tops <span class="pillTag">Category</span>
            </button>
            <button class="menuItem" type="button" role="menuitem">
              Boxers <span class="pillTag">Category</span>
            </button>
            <button class="menuItem" type="button" role="menuitem">
              Skull Caps <span class="pillTag">Category</span>
            </button>
            <button class="menuItem" type="button" role="menuitem">
              Close Caps <span class="pillTag">Category</span>
            </button>

            <div class="divider"></div>

            <button class="menuItem" type="button" role="menuitem">
              View All <span class="pillTag">All</span>
            </button>
          </div>
        </div>
      </nav>
    </div>

    <!-- Cart placeholder (so spacing feels like your real header) -->
    <button class="navBtn" type="button" aria-label="Cart">CART</button>
  </header>

  <section class="hero">
    <div class="heroInner">
      <div class="big">Latest Drop</div>
      <div class="hint">Click “PRODUCTS” to see the dropdown.</div>
    </div>
  </section>

  <script>
    const dd = document.getElementById('prodDD');
    const btn = document.getElementById('prodBtn');
    const menu = document.getElementById('prodMenu');

    function open(){ dd.classList.add('is-open'); menu.hidden = false; btn.setAttribute('aria-expanded','true'); }
    function close(){ dd.classList.remove('is-open'); menu.hidden = true; btn.setAttribute('aria-expanded','false'); }

    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(menu.hidden) open(); else close();
    });

    document.addEventListener('click', ()=> close());
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') close(); });

    // demo: close after clicking an item
    menu.addEventListener('click', (e)=>{
      const item = e.target.closest('button');
      if(!item) return;
      close();
    });
  </script>
</body>
</html>
